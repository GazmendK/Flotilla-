# Single source of truth for every third-party version in this build.
# Renovate/Dependabot update this file; nothing else declares versions.

[versions]
# Language level and toolchain. Kept in one place because build-logic reads it too.
java = "25"

# Static analysis / formatting
errorprone = "2.50.0"
errorpronePlugin = "5.1.0"
nullaway = "0.14.1"
jspecify = "1.0.1"
spotless = "8.9.0"
palantirJavaFormat = "2.96.0"

# Testing
junit = "6.1.2"
assertj = "3.27.7"
archunit = "1.5.0"
jqwik = "1.10.1"

[libraries]
# Nullness annotations. compileOnly everywhere: they carry no runtime behaviour, and
# flotilla-core must stay free of runtime dependencies.
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
# Plain ArchUnit rather than the archunit-junit5 integration: the rules run inside ordinary
# @Test methods, which keeps them independent of the JUnit platform version.
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

# Plugin marker artifacts, consumed by build-logic so the convention plugins can apply them.
# Using the markers (rather than the implementation coordinates) keeps the version identical
# to what `plugins { id(...) version ... }` would resolve.
build-spotless = { module = "com.diffplug.spotless:com.diffplug.spotless.gradle.plugin", version.ref = "spotless" }
build-errorprone = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorpronePlugin" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
