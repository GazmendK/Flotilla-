syntax = "proto3";

package flotilla.v1;

option java_multiple_files = true;
option java_outer_classname = "RaftProto";
option java_package = "dev.flotilla.wire.v1";

service RaftPeerService {
  rpc Deliver(DeliverRequest) returns (DeliverResponse);
}

message DeliverRequest {
  string from = 1;
  string to = 2;
  int64 term = 3;

  oneof body {
    AppendEntriesRequest append_entries_request = 10;
    AppendEntriesResponse append_entries_response = 11;
    RequestVoteRequest request_vote_request = 12;
    RequestVoteResponse request_vote_response = 13;
    InstallSnapshotRequest install_snapshot_request = 14;
    InstallSnapshotResponse install_snapshot_response = 15;
    ReadIndexRequest read_index_request = 16;
    ReadIndexResponse read_index_response = 17;
    TimeoutNowRequest timeout_now_request = 18;
  }
}

message DeliverResponse {}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_NORMAL = 1;
  ENTRY_TYPE_NOOP = 2;
  ENTRY_TYPE_CONFIGURATION = 3;
}

message LogEntry {
  int64 term = 1;
  int64 index = 2;
  EntryType type = 3;
  bytes data = 4;
}

message AppendEntriesRequest {
  int64 prev_log_index = 1;
  int64 prev_log_term = 2;
  repeated LogEntry entries = 3;
  int64 leader_commit = 4;
  // Echoed by the follower, so the leader can tell which of its messages a reply answers.
  int64 round = 5;
}

message AppendEntriesResponse {
  bool success = 1;
  int64 match_index = 2;
  int64 conflict_index = 3;
  int64 conflict_term = 4;
  int64 round = 5;
}

message RequestVoteRequest {
  int64 last_log_index = 1;
  int64 last_log_term = 2;
  bool pre_vote = 3;
}

message RequestVoteResponse {
  bool vote_granted = 1;
  bool pre_vote = 2;
}

message InstallSnapshotRequest {
  int64 last_included_index = 1;
  int64 last_included_term = 2;
  // Byte offset of this chunk within the snapshot; the core is handed whole snapshots.
  int64 offset = 3;
  bytes data = 4;
  bool done = 5;
  // The cluster configuration the snapshot was taken under.
  repeated string voters = 6;
  repeated string learners = 7;
}

message InstallSnapshotResponse {
  // The index through which the follower log now matches the leader.
  int64 match_index = 1;
  bool installed = 2;
}

message ReadIndexRequest {
  bytes request_id = 1;
}

message ReadIndexResponse {
  bytes request_id = 1;
  int64 read_index = 2;
}

message TimeoutNowRequest {}
