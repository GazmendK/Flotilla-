name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto:
    name: protobuf schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Lint, and on pull requests check for breaking changes
        # Lint runs on every push. The breaking-change check runs on pull requests against the base
        # branch, so a change that would stop old and new nodes from understanding each other fails
        # review instead of failing a rolling upgrade. Nothing is pushed to the Buf registry.
        uses: bufbuild/buf-action@v1.5.0
        with:
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' }}
          push: false
          pr_comment: false

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the result on the others -- for a storage engine the
      # difference between platforms is exactly what we want to see.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        # Git Bash is present on the Windows runners too, so one command works everywhere.
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        # The wrapper JAR is a binary in the repository; verify it against the published checksums
        # before executing it.
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, analyse and test
        # `build` runs compilation, Error Prone, NullAway, spotlessCheck and the tests.
        # It is exactly what CONTRIBUTING tells contributors to run locally.
        run: ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Report failures as annotations
        # Annotations are visible on the commit and the pull request without opening the log, so a
        # failure on one platform is readable at a glance. The shell sets pipefail, so the step above
        # still fails when Gradle does.
        if: failure()
        run: |
          PYTHON=$(command -v python3 || command -v python)
          "$PYTHON" - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          for path in glob.glob("**/build/test-results/test/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in case.findall("failure") + case.findall("error"):
                      message = " ".join((problem.get("message") or problem.text or "").split())[:600]
                      print(f"::error title={case.get('classname')}::{case.get('name')}: {message}")
          try:
              log = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              log = []
          for line in log:
              if re.search(r"\.java:\d+: (error|warning)|> Task \S+ FAILED", line):
                  print(f"::error title=build::{line.strip()[:600]}")
          for i, line in enumerate(log):
              if line.startswith("* What went wrong:"):
                  print("::error title=gradle::" + " ".join(l.strip() for l in log[i + 1:i + 6])[:600])
          PY

      - name: Javadoc
        # Doclint is configured to fail on broken references. Once per matrix is enough.
        if: runner.os == 'Linux'
        run: ./gradlew javadoc

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
