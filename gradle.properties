# Build performance. The configuration cache is enabled from the very first commit so that
# no plugin or build-logic change can silently make the build cache-incompatible later on.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 2 GiB is enough for this build; pinned explicitly so local and CI builds behave the same.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The daemon JVM itself is pinned to Java 25 in gradle/gradle-daemon-jvm.properties.
# That matters beyond compilation: Spotless and Error Prone run inside the daemon and need a
# javac that can parse the language level we compile against.
